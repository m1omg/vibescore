# VibeScore: Android build (arm64-v8a APK) on GitHub-hosted Linux runners
name: 'Build: Android'

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI: arm64 (devices) or x86_64 (emulator)'
        required: false
        default: 'arm64'
  push:
    branches:
      - vibescore
    paths-ignore:
      - '**.md'
      - 'share/locale/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a running build finishes; only the newest pending push is kept

env:
  QT_VERSION: '6.10.2'
  QT_MODULES: 'qt5compat qtshadertools'
  NDK_VERSION: '27.2.12479018'
  BUILD_TYPE: 'Release'

jobs:
  build_android:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt-host
          cache: true
          cache-key-prefix: 'qt-host'

      - name: Remember host Qt
        run: echo "VS_QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'android'
          arch: ${{ (inputs.abi || 'arm64') == 'x86_64' && 'android_x86_64' || 'android_arm64_v8a' }}
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt-android
          cache: true
          cache-key-prefix: 'qt-android'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ inputs.abi || 'arm64' }}
          max-size: 4G

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEYSTORE_PASS"
          else
            # No release key configured: sign with a throwaway key so the APK can be installed for testing
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias vibescore -keyalg RSA -keysize 2048 \
              -validity 365 -storepass "$PASS" -keypass "$PASS" -dname "CN=VibeScore CI" -noprompt
          fi
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "QT_ANDROID_KEYSTORE_ALIAS=vibescore"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DMUSESCORE_BUILD_CONFIGURATION=app-mobile \
            -DMUSE_APP_BUILD_MODE=release \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DQT_HOST_PATH="$VS_QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMUSE_COMPILE_USE_COMPILER_CACHE=OFF

      - name: Build
        run: cmake --build build-android -j"$(nproc)"

      - name: Package APK
        run: |
          cmake --build build-android --target apk
          APK="$(find build-android -name '*.apk' -path '*outputs*' | head -1)"
          cp "$APK" "VibeScore-${{ inputs.abi || 'arm64' }}.apk"
          ls -la VibeScore-*.apk

      - name: Check 16 KB page alignment
        run: |
          LIB="$(find build-android/android-build -name 'libVibeScore_*.so' | head -1)"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -l "$LIB" | grep LOAD | awk '{ print $NF }' | sort -u

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VibeScore-Android-${{ inputs.abi || 'arm64' }}
          path: VibeScore-*.apk
          retention-days: 14

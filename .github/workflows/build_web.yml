# VibeScore: web app (Qt for WebAssembly), published on GitHub Pages: the app without threads, and the one with threads
# (Qt for WebAssembly multithread) in threads/; the page chooses (buildscripts/web/index.html)
name: 'Build: Web'

on:
  workflow_dispatch:
  push:
    branches:
      - vibescore
    paths-ignore:
      - '**.md'
      - 'share/locale/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.10.2'
  QT_MODULES: 'qt5compat qtshadertools'
  EMSDK_VERSION: '4.0.7' # the version Qt 6.10 is built with
  BUILD_TYPE: 'Release'
  # Qt's rcc writes the time of each resource file into the app, here the time of the checkout: the wasm differed at
  # every build. With a fixed time it is the same for the same sources, and a deployment that did not change the app's
  # code does not make browsers download it again (the page gives each file its version, see stamp_page.py). The QML
  # does not depend on it (QML_DISK_CACHE=aot, see main.cpp).
  QT_RCC_SOURCE_DATE_OVERRIDE: '1767225600' # 2026-01-01

permissions:
  contents: read

jobs:
  build_web:
    strategy:
      fail-fast: true
      matrix:
        variant: [single, threads]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (Linux host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt-host
          cache: true
          cache-key-prefix: 'qt-host'

      - name: Remember host Qt
        run: echo "VS_QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (WebAssembly)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'all_os'
          target: 'wasm'
          arch: ${{ matrix.variant == 'threads' && 'wasm_multithread' || 'wasm_singlethread' }}
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt-wasm
          cache: true
          cache-key-prefix: qt-wasm-${{ matrix.variant }}

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: web-${{ matrix.variant }}
          max-size: 4G

      - name: Configure
        run: |
          source "$EMSDK/emsdk_env.sh"
          chmod +x "$QT_ROOT_DIR"/bin/qt-cmake*
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-web -G Ninja \
            -DMUSESCORE_BUILD_CONFIGURATION=app-web \
            -DVS_WEB_THREADS=${{ matrix.variant == 'threads' && 'ON' || 'OFF' }} \
            -DMUSE_APP_BUILD_MODE=release \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DQT_HOST_PATH="$VS_QT_HOST_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMUSE_COMPILE_USE_COMPILER_CACHE=OFF

      - name: Build
        run: |
          source "$EMSDK/emsdk_env.sh"
          set +e
          cmake --build build-web -j"$(nproc)" > build-web.log 2>&1
          STATUS=$?
          grep -E "error:|\*\*\*" build-web.log | head -200
          tail -20 build-web.log
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-web-log-${{ matrix.variant }}
          path: build-web.log
          retention-days: 14

      - name: Upload the web app
        uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ matrix.variant }}
          path: build-web/webapp
          retention-days: 3

  # The site: the app without threads, with the one with threads in threads/
  assemble:
    needs: build_web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: buildscripts/web

      - name: Download the web apps
        uses: actions/download-artifact@v4
        with:
          pattern: webapp-*

      - name: Put the app with threads into the site
        run: python3 buildscripts/web/add_threads_app.py webapp-single webapp-threads

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp-single

  deploy:
    needs: assemble
    if: github.ref == 'refs/heads/vibescore'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

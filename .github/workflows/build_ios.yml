# VibeScore: iOS / iPadOS build (unsigned) on GitHub-hosted macOS runners
name: 'Build: iOS'

on:
  workflow_dispatch:
  push:
    branches:
      - vibescore
    paths-ignore:
      - '**.md'
      - 'share/locale/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # a running build finishes; only the newest pending push is kept

env:
  QT_VERSION: '6.10.2'
  QT_MODULES: 'qt5compat qtshadertools'
  BUILD_TYPE: 'Release'

jobs:
  build_ios:
    name: build_ios (${{ matrix.sdk }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unsigned IPA for sideloading
          - sdk: 'iphoneos'
            runner: 'macos-15'
          # Smoke test with screenshots. Qt's iOS package has simulator code for x86_64 only, which the
          # simulators of Apple Silicon Macs do not launch: an Intel Mac runs it
          - sdk: 'iphonesimulator'
            runner: 'macos-15-intel'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (macOS host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt-host
          cache: true
          cache-key-prefix: 'qt-host'

      - name: Remember host Qt
        run: echo "VS_QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (iOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}/qt-ios
          cache: true
          cache-key-prefix: 'qt-ios'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-${{ matrix.sdk }}
          max-size: 4G

      - name: Configure
        run: |
          SDK="${{ matrix.sdk }}"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DMUSESCORE_BUILD_CONFIGURATION=app-mobile \
            -DMUSE_APP_BUILD_MODE=release \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DQT_HOST_PATH="$VS_QT_HOST_PATH" \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMUSE_COMPILE_USE_COMPILER_CACHE=OFF

      - name: Build
        run: |
          SDK="${{ matrix.sdk }}"
          set +e
          EXTRA_ARGS=""
          if [ "$SDK" = "iphonesimulator" ]; then
            # Qt's iOS package has simulator code for x86_64 only
            EXTRA_ARGS="ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO"
          fi
          cmake --build build-ios --config ${BUILD_TYPE} --target MuseScoreStudio -- \
            -sdk "$SDK" -jobs "$(sysctl -n hw.ncpu)" $EXTRA_ARGS \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build-ios.log 2>&1
          STATUS=$?
          grep -E "error:|\*\* BUILD" build-ios.log | head -300
          exit $STATUS

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build-ios.log | head -300 || true

      - name: Package unsigned IPA
        if: success() && matrix.sdk == 'iphoneos'
        run: |
          SDK="${{ matrix.sdk }}"
          APP="build-ios/src/app/${BUILD_TYPE}-${SDK}/VibeScore.app"
          echo "App bundle: $APP"
          # A complete bundle has its executable, Info.plist and the application data
          test -f "$APP/Info.plist" && test -x "$APP/VibeScore" && test -f "$APP/share/sound/MS Basic.sf3" \
            || { echo "Incomplete app bundle"; ls -la "$APP"; exit 1; }
          du -sh "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../VibeScore-unsigned.ipa Payload)
          ls -la VibeScore-unsigned.ipa

      - name: Upload IPA
        if: success() && matrix.sdk == 'iphoneos'
        uses: actions/upload-artifact@v4
        with:
          name: VibeScore-iOS-${{ matrix.sdk }}
          path: VibeScore-unsigned.ipa
          retention-days: 14

      - name: Simulator smoke test
        if: success() && matrix.sdk == 'iphonesimulator'
        run: |
          buildscripts/mobile/ios_simulator_smoke_test.sh "build-ios/src/app/${BUILD_TYPE}-iphonesimulator/VibeScore.app" smoke-test

      - name: Upload smoke test screenshots and logs
        if: always() && matrix.sdk == 'iphonesimulator'
        uses: actions/upload-artifact@v4
        with:
          name: VibeScore-iOS-simulator-smoke-test
          path: smoke-test
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-log-${{ matrix.sdk }}
          path: build-ios.log
          retention-days: 7

<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- 1 CSS pixel = 1 Qt device independent pixel; the app handles zooming (pinch) itself -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=0">
    <meta name="theme-color" content="#4B2BD1">
    <meta name="description" content="VibeScore: write, play and print sheet music in the browser. Based on MuseScore Studio.">
    <title>VibeScore</title>
    <link rel="icon" href="vibescore.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F5F6;
                     font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111132; }
        @media (prefers-color-scheme: dark) { html, body { background: #2D2D30; color: #EBEBEB; } }
        #screen { width: 100%; height: 100%; }
        #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 16px; text-align: center; padding: 16px; }
        #loading img { width: 96px; height: 96px; }
        #loading h1 { font-size: 22px; font-weight: 600; margin: 0; }
        #status { font-size: 14px; opacity: 0.8; min-height: 1.4em; max-width: 480px; white-space: pre-line; }
        #progress { width: min(320px, 80vw); height: 4px; border-radius: 2px; background: rgba(128, 128, 128, 0.25);
                    overflow: hidden; }
        #progress div { width: 0%; height: 100%; background: #4B2BD1; transition: width 0.2s; }
        #problem { font-size: 13px; max-width: 480px; color: #C4132C; white-space: pre-line; }
        @media (prefers-color-scheme: dark) { #problem { color: #FF7A85; } }
        #problem:empty { display: none; }
        #banner { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10; display: none;
                  align-items: center; gap: 12px; max-width: min(640px, calc(100vw - 32px)); box-sizing: border-box;
                  padding: 10px 12px 10px 16px; border-radius: 6px; font-size: 13px; background: #FFF3C4;
                  color: #3D2E00; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
        #banner button { flex: none; border: none; border-radius: 4px; padding: 6px 10px; font: inherit;
                         background: rgba(0, 0, 0, 0.1); color: inherit; cursor: pointer; }
        #notice { font-size: 12px; opacity: 0.6; max-width: 480px; }
        #notice a { color: inherit; }
    </style>
</head>
<body>
    <div id="loading">
        <img src="vibescore.svg" alt="">
        <h1>VibeScore</h1>
        <div id="status">Loading…</div>
        <div id="progress"><div></div></div>
        <div id="problem"></div>
        <noscript>VibeScore needs JavaScript.</noscript>
        <div id="notice">
            Based on MuseScore Studio. Not affiliated with or endorsed by Muse Group.
            Free software (<a href="https://www.gnu.org/licenses/gpl-3.0.html">GPLv3</a>):
            <a href="https://github.com/m1omg/vibescore">source code</a>.
            Your scores stay in this browser.
        </div>
    </div>
    <div id="screen" style="display: none"></div>
    <!-- Problems found while starting (e.g. no saved data) that the app does not know about -->
    <div id="banner" role="alert"><span></span><button onclick="this.parentElement.style.display = 'none'">OK</button></div>

    <!-- The build: makes the browser load the files of this build, not ones it kept from an earlier one
         (written by buildscripts/web/stamp_page.py) -->
    <script>
        window.VS_BUILD = '@VS_BUILD@';
        window.VS_WASM_SIZE = Number('@VS_WASM_SIZE@') || 0;
    </script>
    <script src="vibescore-web.js?v=@VS_BUILD@"></script>
    <script src="VibeScore.js?v=@VS_BUILD@"></script>
    <script src="qtloader.js?v=@VS_BUILD@"></script>
    <script>
        async function vibescoreStart() {
            const loading = document.querySelector('#loading');
            const screen = document.querySelector('#screen');
            const loader = vibescoreLoader({
                status: document.querySelector('#status'),
                progress: document.querySelector('#progress'),
                problem: document.querySelector('#problem'),
                banner: document.querySelector('#banner'),
            });

            if (!loader.checkBrowser()) {
                return;
            }
            vibescorePrefetchShare();

            try {
                const instance = await qtLoad({
                    instantiateWasm: loader.instantiateWasm('VibeScore.wasm?v=' + window.VS_BUILD, window.VS_WASM_SIZE),
                    preRun: [module => vibescorePreRun(module, loader)],
                    qt: {
                        onLoaded: () => {
                            loader.started();
                            loading.style.display = 'none';
                            screen.style.display = 'block';
                        },
                        onExit: exitData => {
                            loader.stopped(exitData);
                            screen.style.display = 'none';
                            loading.style.display = 'flex';
                        },
                        entryFunction: window.VibeScore_entry,
                        containerElements: [screen],
                    }
                });
                window.vibescoreInstance = instance; // for debugging in the browser's console
                vibescoreLoadSoundFont(instance, console.warn);
            } catch (error) {
                loader.failed(error);
            }
        }

        vibescoreStart().catch(error => {
            // e.g. a script of the page that the browser did not load
            console.error(error);
            document.querySelector('#status').textContent = 'VibeScore could not start: ' + error;
        });
    </script>
</body>
</html>

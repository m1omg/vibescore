<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- 1 CSS pixel = 1 Qt device independent pixel; the app handles zooming (pinch) itself -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=0">
    <meta name="theme-color" content="#4B2BD1">
    <meta name="description" content="VibeScore: write, play and print sheet music in the browser. Based on MuseScore Studio.">
    <title>VibeScore</title>
    <link rel="icon" href="vibescore.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F5F6;
                     font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111132; }
        @media (prefers-color-scheme: dark) { html, body { background: #2D2D30; color: #EBEBEB; } }
        #screen { width: 100%; height: 100%; }
        #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; gap: 16px; text-align: center; padding: 16px; }
        #loading img { width: 96px; height: 96px; }
        #loading h1 { font-size: 22px; font-weight: 600; margin: 0; }
        #status { font-size: 14px; opacity: 0.8; min-height: 1.4em; }
        #notice { font-size: 12px; opacity: 0.6; max-width: 480px; }
        #notice a { color: inherit; }
    </style>
</head>
<body onload="vibescoreStart()">
    <div id="loading">
        <img src="vibescore.svg" alt="">
        <h1>VibeScore</h1>
        <div id="status">Loading…</div>
        <noscript>VibeScore needs JavaScript.</noscript>
        <div id="notice">
            Based on MuseScore Studio. Not affiliated with or endorsed by Muse Group.
            Free software (<a href="https://www.gnu.org/licenses/gpl-3.0.html">GPLv3</a>):
            <a href="https://github.com/m1omg/vibescore">source code</a>.
            Your scores stay in this browser.
        </div>
    </div>
    <div id="screen" style="display: none"></div>

    <script src="vibescore-web.js"></script>
    <script>
        async function vibescoreStart() {
            const loading = document.querySelector('#loading');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#status');
            const setStatus = text => status.textContent = text;

            try {
                const instance = await qtLoad({
                    preRun: [module => vibescorePreRun(module, setStatus)],
                    qt: {
                        onLoaded: () => {
                            loading.style.display = 'none';
                            screen.style.display = 'block';
                        },
                        onExit: exitData => {
                            setStatus('VibeScore stopped' + (exitData.text ? ': ' + exitData.text : '')
                                      + '. Reload the page to start it again.');
                            screen.style.display = 'none';
                            loading.style.display = 'flex';
                        },
                        entryFunction: window.VibeScore_entry,
                        containerElements: [screen],
                    }
                });
                window.vibescoreInstance = instance; // for debugging in the browser's console
                vibescoreLoadSoundFont(instance, console.warn);
            } catch (error) {
                console.error(error);
                setStatus('VibeScore could not start: ' + error);
            }
        }
    </script>
    <script src="VibeScore.js"></script>
    <script src="qtloader.js"></script>
</body>
</html>
